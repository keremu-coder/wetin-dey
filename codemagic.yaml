workflows:
  ios-release:
    name: Wetin Dey iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: v20.11.0
      groups:
        - firebase_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wetindey.app
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build Next.js app
        script: npm run build
      - name: Capacitor Sync
        script: npx cap sync ios
      - name: Add Firebase and privacy manifest to the Xcode project
        script: node scripts/patch-ios-project.mjs
      - name: Load Firebase configuration
        script: |
          echo $IOS_FIREBASE_SECRET > $CM_BUILD_DIR/ios/App/App/GoogleService-Info.plist
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: Wetin Dey
        submit_to_testflight: true
