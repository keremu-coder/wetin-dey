<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — Wetin Dey</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #EBEFE9;
      color: #14201A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      max-width: 400px;
      text-align: center;
      background: #fff;
      border-radius: 20px;
      padding: 2rem 1.5rem;
      box-shadow: 0 4px 24px rgba(20, 32, 26, 0.08);
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
      color: #14201A;
    }
    p {
      font-size: 0.9375rem;
      line-height: 1.5;
      color: #526155;
      margin: 0 0 1.5rem;
    }
    button {
      background: #1E2F5C;
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 0.85rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>Wetin Dey needs a connection to load your spaces, messages, and the archive. Check your data or Wi-Fi and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
